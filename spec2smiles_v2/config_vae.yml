# SPEC2SMILES Pipeline Configuration
# VAE Model with OLD architecture settings (but 28 descriptors)

# Paths
paths:
  data_input: data/input
  data_output: data/output

# Dataset
dataset: gnps

# Device: cuda, mps, cpu, auto
device: auto

# Spectrum Processing
spectrum:
  n_bins: 500
  bin_width: 1.0
  max_mz: 500.0
  transform: sqrt
  normalize: true

# Keep our 28 optimized descriptors
descriptors:
  - fr_phos_ester
  - Chi3n
  - Chi2n
  - NumAtomStereoCenters
  - SMR_VSA1
  - SMR_VSA4
  - NumSaturatedCarbocycles
  - SMR_VSA5
  - EState_VSA10
  - PEOE_VSA7
  - NumSaturatedRings
  - fr_Al_OH
  - VSA_EState3
  - PEOE_VSA10
  - SPS
  - fr_ether
  - SMR_VSA3
  - qed
  - SlogP_VSA5
  - AvgIpc
  - FractionCSP3
  - SlogP_VSA3
  - Kappa2
  - RingCount
  - SlogP_VSA11
  - VSA_EState2
  - HallKierAlpha
  - NumAromaticRings

# Part A: OLD architecture (larger)
part_a:
  cnn_hidden: 512        # OLD: 512 (current: 128)
  transformer_dim: 512   # OLD: 512 (current: 128)
  n_heads: 8
  n_transformer_layers: 6  # OLD: 6 (current: 2)
  d_ff: 2048             # OLD: 2048 (current: 256)
  dropout: 0.2
  learning_rate: 0.0005
  weight_decay: 0.01
  max_epochs: 200
  batch_size: 1024       # OLD: 1024 (current: 64)
  gradient_clip: 1.0
  patience: 30

# Part B: VAE (OLD model type)
part_b:
  model: vae

  vae:
    latent_dim: 128
    hidden_dim: 256      # OLD: 256
    n_layers: 2          # OLD: 2
    dropout: 0.2
    max_seq_len: 100
    learning_rate: 0.0003
    n_epochs: 100
    batch_size: 128
    kl_cycle_length: 20  # Cyclical KL annealing
    gradient_clip: 1.0

  augment:
    enabled: false
    n_augment: 5

  descriptor_augment:
    enabled: false
    noise_prob: 0.5
    noise_scale: 1.0

# Inference
inference:
  n_candidates: 50
  temperature: 1.0
  top_p: 0.8

# Data Split
split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
