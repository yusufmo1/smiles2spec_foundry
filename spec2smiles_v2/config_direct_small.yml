# SPEC2SMILES Pipeline Configuration
# DirectDecoder at VAE-equivalent size (~4M params)

# Paths
paths:
  data_input: data/input
  data_output: data/output

# Dataset
dataset: gnps

# Device: cuda, mps, cpu, auto
device: auto

# Spectrum Processing
spectrum:
  n_bins: 500
  bin_width: 1.0
  max_mz: 500.0
  transform: sqrt
  normalize: true

# Keep our 28 optimized descriptors
descriptors:
  - fr_phos_ester
  - Chi3n
  - Chi2n
  - NumAtomStereoCenters
  - SMR_VSA1
  - SMR_VSA4
  - NumSaturatedCarbocycles
  - SMR_VSA5
  - EState_VSA10
  - PEOE_VSA7
  - NumSaturatedRings
  - fr_Al_OH
  - VSA_EState3
  - PEOE_VSA10
  - SPS
  - fr_ether
  - SMR_VSA3
  - qed
  - SlogP_VSA5
  - AvgIpc
  - FractionCSP3
  - SlogP_VSA3
  - Kappa2
  - RingCount
  - SlogP_VSA11
  - VSA_EState2
  - HallKierAlpha
  - NumAromaticRings

# Part A: Not used for this test
part_a:
  cnn_hidden: 128
  transformer_dim: 128
  n_heads: 4
  n_transformer_layers: 2
  d_ff: 256
  dropout: 0.1
  learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 100
  batch_size: 64
  gradient_clip: 1.0
  patience: 20

# Part B: Small DirectDecoder (VAE-equivalent ~4M params)
part_b:
  model: direct

  direct:
    hidden_dim: 256       # Match VAE hidden_dim
    n_layers: 2           # Match VAE n_layers
    n_heads: 4            # Reduced heads for smaller model
    d_ff: 512             # 2x hidden (reduced from 4x)
    dropout: 0.2          # Match VAE dropout
    max_seq_len: 100
    learning_rate: 0.0003 # Match VAE learning rate
    n_epochs: 100         # Match VAE epochs
    batch_size: 128       # Match VAE batch size
    label_smoothing: 0.1
    gradient_clip: 1.0
    patience: 10

  augment:
    enabled: false
    n_augment: 5

  descriptor_augment:
    enabled: false
    noise_prob: 0.5
    noise_scale: 1.0

# Inference
inference:
  n_candidates: 50
  temperature: 1.0
  top_p: 0.8

# Data Split
split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
